# ---------------------------------------------------------------------------
# ECN — Executable Consensus Network
# Multi-Region Kubernetes Manifests
#
# Deploy ECN across multiple cloud regions (e.g. us-east-1 + eu-west-1 +
# ap-southeast-1) for:
#   - Low-latency consensus for globally distributed supply chains
#   - Fault tolerance: consensus continues if one region becomes unreachable
#   - Data sovereignty: audit trail replicated to each region
#
# Architecture
# ------------
#
#   Region A (primary)         Region B (secondary)       Region C (secondary)
#   ┌─────────────────┐        ┌─────────────────┐        ┌─────────────────┐
#   │  ecn-api pod    │        │  ecn-api pod    │        │  ecn-api pod    │
#   │  ├─ Node-A1     │        │  ├─ Node-B1     │        │  ├─ Node-C1     │
#   │  ├─ Node-A2     │        │  ├─ Node-B2     │        │  └─ Node-C2     │
#   │  └─ Node-A3     │        │  └─ Node-B3     │        │                 │
#   │  SQLite / PVC   │        │  SQLite / PVC   │        │  SQLite / PVC   │
#   └────────┬────────┘        └────────┬────────┘        └────────┬────────┘
#            │                          │                           │
#            └──────────────────────────┼───────────────────────────┘
#                              Global Load Balancer
#                          (AWS ALB / GCP GLB / Cloudflare)
#
# In this topology each region runs its own independent ECN network.
# Cross-region audit synchronisation is handled at the storage layer
# (e.g. Postgres logical replication, CockroachDB, or Litestream for SQLite).
#
# Deployment instructions
# -----------------------
# 1. Set context for each region cluster:
#      kubectl config use-context region-a
#      kubectl apply -f k8s/ecn-multiregion.yaml -l region=us-east-1
#
# 2. Repeat for region-b and region-c with appropriate label overrides.
#
# 3. Configure your Global Load Balancer to route to all three region services.
#
# 4. For cross-region audit replication, deploy Litestream as a sidecar
#    (see the Litestream sidecar stanza below) or use a managed Postgres
#    with logical replication enabled.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Namespace
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: ecn
  labels:
    app.kubernetes.io/name: ecn
    app.kubernetes.io/component: namespace

---

# ---------------------------------------------------------------------------
# ConfigMap — Region A (primary, e.g. us-east-1)
# Duplicate and adjust per region, changing ECN_REGION and node count.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecn-config-region-a
  namespace: ecn
  labels:
    app.kubernetes.io/name: ecn
    region: us-east-1
data:
  ECN_PRODUCTS: "LAPTOP-001,PHONE-002,TABLET-003,WATCH-004,CAMERA-005"
  ECN_NODES: "Warehouse-A,Shipper-A,Customs-A,Insurer-A,Retailer-A"
  ECN_BASE_PORT: "18000"
  LOG_LEVEL: "INFO"
  # Bind to all interfaces so nodes are reachable across the pod network
  ECN_NODE_HOST: "0.0.0.0"
  # Quorum: 0.67 for BFT tolerance of 1/3 faulty nodes (recommended multi-region)
  ECN_QUORUM_THRESHOLD: "0.67"
  ECN_BILLING_PERIOD: "monthly"
  ECN_REGION: "us-east-1"

---

# ---------------------------------------------------------------------------
# ConfigMap — Region B (e.g. eu-west-1)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecn-config-region-b
  namespace: ecn
  labels:
    app.kubernetes.io/name: ecn
    region: eu-west-1
data:
  ECN_PRODUCTS: "LAPTOP-001,PHONE-002,TABLET-003,WATCH-004,CAMERA-005"
  ECN_NODES: "Warehouse-B,Shipper-B,Customs-B,Insurer-B,Retailer-B"
  ECN_BASE_PORT: "18000"
  LOG_LEVEL: "INFO"
  ECN_NODE_HOST: "0.0.0.0"
  ECN_QUORUM_THRESHOLD: "0.67"
  ECN_BILLING_PERIOD: "monthly"
  ECN_REGION: "eu-west-1"

---

# ---------------------------------------------------------------------------
# ConfigMap — Region C (e.g. ap-southeast-1)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecn-config-region-c
  namespace: ecn
  labels:
    app.kubernetes.io/name: ecn
    region: ap-southeast-1
data:
  ECN_PRODUCTS: "LAPTOP-001,PHONE-002,TABLET-003,WATCH-004,CAMERA-005"
  ECN_NODES: "Warehouse-C,Shipper-C,Customs-C,Insurer-C,Retailer-C"
  ECN_BASE_PORT: "18000"
  LOG_LEVEL: "INFO"
  ECN_NODE_HOST: "0.0.0.0"
  ECN_QUORUM_THRESHOLD: "0.67"
  ECN_BILLING_PERIOD: "monthly"
  ECN_REGION: "ap-southeast-1"

---

# ---------------------------------------------------------------------------
# Secret — shared across all regions (deploy separately per cluster)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: ecn-secrets
  namespace: ecn
type: Opaque
stringData:
  ECN_ADMIN_KEY: "REPLACE_WITH_SECURE_RANDOM_SECRET"
  ECN_JWT_SECRET: ""
  ECN_JWT_ISSUER: ""
  ECN_JWT_AUDIENCE: ""

---

# ---------------------------------------------------------------------------
# PersistentVolumeClaim — Region A
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ecn-data-region-a
  namespace: ecn
  labels:
    app.kubernetes.io/name: ecn
    region: us-east-1
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: gp3

---

# ---------------------------------------------------------------------------
# Deployment — Region A (us-east-1)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecn-api-region-a
  namespace: ecn
  labels:
    app.kubernetes.io/name: ecn
    app.kubernetes.io/component: api
    region: us-east-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecn-api
      region: us-east-1
  template:
    metadata:
      labels:
        app: ecn-api
        region: us-east-1
        app.kubernetes.io/name: ecn
    spec:
      # Prefer scheduling to nodes in the us-east-1 region
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-east-1
        # Spread replicas across availability zones
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ecn-api
                    region: us-east-1
                topologyKey: topology.kubernetes.io/zone
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: ecn-api
          image: ecn:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ecn-config-region-a
            - secretRef:
                name: ecn-secrets
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: ECN_DB_PATH
              value: "/var/ecn/ecn.db"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          volumeMounts:
            - name: ecn-data
              mountPath: /var/ecn
          readinessProbe:
            httpGet:
              path: /network/state
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /network/state
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3

        # ---------------------------------------------------------------------------
        # Litestream sidecar — continuous SQLite replication to S3-compatible storage
        # Enables cross-region audit log replication and point-in-time recovery.
        # Remove if using Postgres or CockroachDB instead.
        # See: https://litestream.io/
        # ---------------------------------------------------------------------------
        # - name: litestream
        #   image: litestream/litestream:0.3.13
        #   args: ["replicate"]
        #   env:
        #     - name: LITESTREAM_ACCESS_KEY_ID
        #       valueFrom: { secretKeyRef: { name: ecn-s3-creds, key: access_key_id } }
        #     - name: LITESTREAM_SECRET_ACCESS_KEY
        #       valueFrom: { secretKeyRef: { name: ecn-s3-creds, key: secret_access_key } }
        #   volumeMounts:
        #     - name: ecn-data
        #       mountPath: /var/ecn
        #     - name: litestream-config
        #       mountPath: /etc/litestream.yml
        #       subPath: litestream.yml

      volumes:
        - name: ecn-data
          persistentVolumeClaim:
            claimName: ecn-data-region-a

---

# ---------------------------------------------------------------------------
# Service — Region A (internal ClusterIP)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: ecn-api-region-a
  namespace: ecn
  labels:
    app.kubernetes.io/name: ecn
    region: us-east-1
spec:
  type: ClusterIP
  selector:
    app: ecn-api
    region: us-east-1
  ports:
    - name: http
      port: 80
      targetPort: 8000

---

# ---------------------------------------------------------------------------
# HPA — Region A
# ---------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecn-api-hpa-region-a
  namespace: ecn
  labels:
    region: us-east-1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecn-api-region-a
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---

# ---------------------------------------------------------------------------
# PodDisruptionBudget — Region A
# Ensures at least 1 replica is always available during node maintenance.
# ---------------------------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ecn-api-pdb-region-a
  namespace: ecn
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ecn-api
      region: us-east-1

---
# ---------------------------------------------------------------------------
# NOTE: Repeat the Deployment, Service, HPA, and PDB blocks above for
# region-b (eu-west-1) and region-c (ap-southeast-1), substituting:
#   - configMapRef.name: ecn-config-region-b / ecn-config-region-c
#   - metadata.name suffix: -region-b / -region-c
#   - selector region label: eu-west-1 / ap-southeast-1
#   - topology.kubernetes.io/region value accordingly
#   - PVC claimName: ecn-data-region-b / ecn-data-region-c
#
# Global Load Balancer
# --------------------
# Use AWS Route53 latency routing, GCP GCLB, or Cloudflare Load Balancing to
# route each customer to the nearest healthy region.
#
# Cross-region audit replication
# --------------------------------
# Option A (SQLite + Litestream): uncomment the Litestream sidecar above and
#   configure ECN_DB_PATH=/var/ecn/ecn.db with replication to s3://your-bucket/
#
# Option B (Postgres): set ECN_DB_PATH=postgresql://user:pass@global-db/ecn
#   and use CockroachDB or AWS Aurora Global Database for multi-region writes.
# ---------------------------------------------------------------------------
